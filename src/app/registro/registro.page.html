<ion-header>
<ion-toolbar color ="secondary"> 
    <ion-title>Registro del alumno</ion-title>
    <ion-button href="home" size="small"> 
      Ir a Home  
    </ion-button>
</ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>
  <ion-list>
    <ion-item>
      <ion-input label="Nombre completo" 
      labelPlacement="floating"
      [(ngModel)]="usuario.nombre" type="text" ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Matricula" 
      labelPlacement="floating"
      [(ngModel)]="usuario.matricula" type="text" ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Correo electronico" 
      labelPlacement="floating"
      [(ngModel)]="usuario.correo" type="text" ></ion-input>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top"
    (click)="guardarDatos()">
      Guardar
    </ion-button>

  </ion-list>

</ion-content>
