<ion-header>
<ion-toolbar color ="secondary"> 
    <ion-title>Registro de Carreras</ion-title>
    <ion-button href="home" size="small"> 
      Ir a Home  
    </ion-button>
</ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>
  <ion-list>
    <ion-item>
      <ion-input label="Carrera:" 
      labelPlacement="floating"
      [(ngModel)]="carrera.nombre" type="text" ></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Tipo:" labelPlacement="stacked"
        placeholder="Selecciona un tipo"
        [(ngModel)]="carrera.tipo">
        @for (t of tipos; track t.valor) {
          <ion-select-option [value]="t.valor">
            {{ t.etiqueta }}
          </ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-button expand="block" class="ion-margin-top"
    (click)="guardarDatos()">
      Guardar
    </ion-button>

  </ion-list>

</ion-content>
