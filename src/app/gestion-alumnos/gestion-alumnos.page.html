<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>
      Gestion de alummnos
    </ion-title>
    <ion-button href="home" size="small"> 
      Ir a Home  
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>

    <ion-item>
      <ion-input label="Número de control:" labelPlacement="floating"
        [(ngModel)]="alumnos.n_control" type="text" maxlength="10">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Nombre:" labelPlacement="floating" 
        [(ngModel)]="alumnos.nombre" Type="text">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Segundo Nombre:" labelPlacement="floating" 
        [(ngModel)]="alumnos.s_nombre" Type="text">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Apellido Paterno:" labelPlacement="floating"
        [(ngModel)]="alumnos.apat" Type="text"> 
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Apellido Materno:" labelPlacement="floating" 
        [(ngModel)]="alumnos.amat" Type="text"> 
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Fecha de Nacimiento:" 
        [(ngModel)]="alumnos.fecha" Type="date"> 
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Género:" labelPlacement="stacked"
        placeholder="Selecciona"
        [(ngModel)]="alumnos.genero">
        <ion-select-option value="H">Hombre</ion-select-option>
        <ion-select-option value="M">Mujer</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-select label="Carrera:" labelPlacement="stacked"
        placeholder="Selecciona una carrera"
        [(ngModel)]="alumnos.fk_caralu">
        @for (carrera of listaCarreras; track carrera.id) {
          <ion-select-option [value]="carrera.id">
            {{ carrera.nombre }}
          </ion-select-option>
        }
      </ion-select>
    </ion-item>

  </ion-list>
  <ion-button expand="block"(click)="validarGuardar()">
    Guardar 
  </ion-button>

</ion-content>
